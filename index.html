<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>待办清单 - 生活效率工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 via-indigo-900 to-purple-900">
    <header class="bg-black/30 backdrop-blur-sm border-b border-white/10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="text-4xl">✅</div>
                <div>
                    <h1 class="text-2xl font-bold text-white">待办清单</h1>
                    <p class="text-sm text-blue-300">高效管理，让生活更有条理</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-blue-500/20 px-4 py-2 rounded-full">
                <span class="text-xl">🏆</span>
                <span class="text-white font-bold" id="header-trophies">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10">
                <div class="text-3xl mb-2">📝</div>
                <div class="text-white text-2xl font-bold" id="todo-total">0</div>
                <div class="text-blue-300 text-sm">总任务</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10">
                <div class="text-3xl mb-2">⏳</div>
                <div class="text-white text-2xl font-bold" id="todo-pending">0</div>
                <div class="text-blue-300 text-sm">待完成</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10">
                <div class="text-3xl mb-2">✅</div>
                <div class="text-white text-2xl font-bold" id="todo-completed">0</div>
                <div class="text-blue-300 text-sm">已完成</div>
            </div>
            <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10">
                <div class="text-3xl mb-2">🏆</div>
                <div class="text-white text-2xl font-bold" id="todo-trophies">0</div>
                <div class="text-blue-300 text-sm">获得奖杯</div>
            </div>
        </div>

        <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10 mb-6">
            <div class="flex items-center justify-between mb-2">
                <span class="text-white font-semibold">完成进度</span>
                <span class="text-blue-300" id="todo-progress-text">0%</span>
            </div>
            <div class="w-full bg-white/20 rounded-full h-4 overflow-hidden">
                <div id="todo-progress-bar" class="h-full bg-gradient-to-r from-green-500 to-emerald-400 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10 mb-6">
            <h3 class="text-lg font-bold text-white mb-4">➕ 添加待办事项</h3>
            <form id="todo-form" class="space-y-4">
                <div>
                    <input type="text" id="todo-input" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-3 text-white placeholder-white/50 focus:outline-none focus:border-blue-500" placeholder="输入任务内容...">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-white text-sm mb-2">截止时间（可选）</label>
                        <input type="datetime-local" id="todo-deadline" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-white text-sm mb-2">优先级</label>
                        <select id="todo-priority" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                            <option value="low">🟢 低优先级</option>
                            <option value="medium" selected>🟡 中优先级</option>
                            <option value="high">🔴 高优先级</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-3 rounded-lg font-semibold hover:opacity-90 transition-opacity">
                    <i class="fas fa-plus mr-2"></i> 添加任务
                </button>
            </form>
        </div>

        <div class="flex gap-2 mb-4">
            <button onclick="filterTodos('all')" id="filter-all" class="filter-btn active">全部</button>
            <button onclick="filterTodos('pending')" id="filter-pending" class="filter-btn">未完成</button>
            <button onclick="filterTodos('completed')" id="filter-completed" class="filter-btn">已完成</button>
        </div>

        <div class="space-y-3" id="todo-list"></div>

        <div class="mt-6 bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10">
            <h3 class="text-lg font-bold text-white mb-4">🏆 成就徽章</h3>
            <div class="flex flex-wrap gap-3" id="todo-badges"></div>
        </div>
    </main>

    <div id="edit-todo-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold text-white">编辑待办事项</h3>
                <button onclick="closeEditTodoModal()" class="text-white hover:text-red-400">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="edit-todo-form">
                <input type="hidden" id="edit-todo-id">
                <div class="mb-4">
                    <label class="block text-white text-sm mb-2">任务内容</label>
                    <input type="text" id="edit-todo-text" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white placeholder-white/50 focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-white text-sm mb-2">截止时间</label>
                    <input type="datetime-local" id="edit-todo-deadline" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-white text-sm mb-2">优先级</label>
                    <select id="edit-todo-priority" class="w-full bg-white/10 border border-white/20 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                        <option value="low">🟢 低优先级</option>
                        <option value="medium">🟡 中优先级</option>
                        <option value="high">🔴 高优先级</option>
                    </select>
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="closeEditTodoModal()" class="flex-1 bg-gray-600 text-white py-2 rounded-lg hover:bg-gray-500 transition-colors">取消</button>
                    <button type="submit" class="flex-1 bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-2 rounded-lg hover:opacity-90 transition-opacity">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="todo-success-animation" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none z-50 hidden">
        <div class="text-center">
            <div class="text-8xl animate-bounce">✅</div>
            <div class="text-2xl text-white font-bold mt-4" id="todo-success-message">太棒了！</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
